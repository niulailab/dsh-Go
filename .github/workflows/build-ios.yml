name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Check iOS SDK
        run: |
          xcodebuild -showsdks
          ls /Applications/Xcode_16.2.app/Contents/Developer/Platforms/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build unsigned IPA (Flutter + no signing)
        working-directory: app
        run: |
          set -o pipefail
          # 直接让 Flutter 走完整构建链；用 EXTRA 参数关闭签名
          flutter build ios --release --no-codesign \
            --build-name=1.0.12 --build-number=${{ github.run_number }} \
            --no-pub

      - name: Package unsigned IPA
        working-directory: app
        run: |
          APP=$(find build/ios_dd/Build/Products/Release-iphoneos build/ios/iphoneos \
                -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          echo "APP=$APP"
          test -d "$APP" || { echo "Runner.app not found"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -r "$APP" build/Payload/Runner.app
          cd build && zip -qry dsh-ios-unsign.ipa Payload
          ls -lh dsh-ios-unsign.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-unsign
          path: app/build/dsh-ios-unsign.ipa
          retention-days: 30
