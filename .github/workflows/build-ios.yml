# iOS 构建（未签名 Runner.app，供全能签等工具自行签名）
# 背景：dsh-Go 原仓库只有 Android 构建链；本 workflow 在 macOS runner 上用
# Flutter 3.47.7（与原仓库 .metadata revision 一致）产出未签名 ipa/app。
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Build (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Unsign + package
        working-directory: app
        run: |
          set -e
          mkdir -p out
          cp -R build/ios/iphoneos/Runner.app out/Runner.app
          # flutter 构建会塞一个临时开发签名，去掉它，交给全能签等工具自己签
          codesign --remove-signature out/Runner.app 2>/dev/null || true
          ( cd out && du -sh Runner.app
            mkdir -p payload/Payload
            mv Runner.app payload/Payload/
            cd payload
            ditto -c -k --sequesterRsrc --keepParent Payload dsh-go-ios-unsigned.ipa
            ls -la
            mv dsh-go-ios-unsigned.ipa .. )
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-ios-unsigned-ipa
          path: out/dsh-go-ios-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-ios-runner-app
          path: out/payload/Payload/Runner.app
          retention-days: 7
          if-no-files-found: warn
