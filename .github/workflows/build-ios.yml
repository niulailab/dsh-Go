name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Check iOS SDK
        run: |
          xcodebuild -showsdks
          ls /Applications/Xcode_16.2.app/Contents/Developer/Platforms/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build unsigned IPA (Flutter + no signing)
        working-directory: app
        run: |
          # Flutter 在构建完成后会做一次 "需要 Development Team" 的检查并返回非 0，
          # 但此时 Runner.app 已编译完成。因此忽略退出码，改为校验产物是否存在。
          flutter build ios --release --no-codesign \
            --build-name=1.0.12 --build-number=${{ github.run_number }} \
            --no-pub || echo "flutter build returned non-zero (expected: no signing team)"
          echo "--- artifacts ---"
          ls -la build/ios/iphoneos/ 2>/dev/null || true
          test -d build/ios/iphoneos/Runner.app || {
            echo "Runner.app missing — build truly failed"
            exit 1
          }
          echo "Runner.app OK"

      - name: Package unsigned IPA
        working-directory: app
        run: |
          APP=build/ios/iphoneos/Runner.app
          echo "APP=$APP"
          test -d "$APP" || { echo "Runner.app not found"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -r "$APP" build/Payload/Runner.app
          cd build && zip -qry dsh-ios-unsign.ipa Payload
          ls -lh dsh-ios-unsign.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-unsign
          path: app/build/dsh-ios-unsign.ipa
          retention-days: 30
