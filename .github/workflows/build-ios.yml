name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install iOS platform SDK
        run: |
          # Xcode 16 起 iOS 平台包不再随 Xcode 预装只需按需下载
          sudo xcodebuild -downloadPlatform iOS || sudo xcodebuild -downloadPlatform iOS
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build unsigned IPA (xcodebuild, no signing)
        working-directory: app
        run: |
          set -o pipefail
          # 先让 Flutter 生成 App.framework / flutter_assets / Generated.xcconfig
          flutter build ios --release --no-codesign --config-only \
            --build-name=1.0.12 --build-number=${{ github.run_number }}
          cd ios && pod install --repo-update
          cd ..
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned IPA
        working-directory: app
        run: |
          APP=$(find build/ios_dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          test -d "$APP" || { echo "Runner.app not found"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -r "$APP" build/Payload/Runner.app
          cd build && zip -qry dsh-ios-unsign.ipa Payload
          ls -lh dsh-ios-unsign.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-unsign
          path: app/build/dsh-ios-unsign.ipa
          retention-days: 30
