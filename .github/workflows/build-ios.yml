name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install iOS platform runtime
        run: |
          # Xcode 16 起平台运行时需单独下载；下载失败则直接失败，避免后续误判
          xcodebuild -downloadPlatform iOS
          echo "--- installed platforms ---"
          xcrun simctl list runtimes 2>/dev/null | head -20 || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build unsigned IPA (SPM, no signing)
        working-directory: app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign \
            --build-name=1.0.12 --build-number=${{ github.run_number }} \
            || true

          echo "=== fallback: xcodebuild ==="
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned IPA
        working-directory: app
        run: |
          APP=$(find build/ios_dd/Build/Products/Release-iphoneos build/ios/iphoneos \
                -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          echo "APP=$APP"
          test -d "$APP" || { echo "Runner.app not found"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -r "$APP" build/Payload/Runner.app
          cd build && zip -qry dsh-ios-unsign.ipa Payload
          ls -lh dsh-ios-unsign.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-unsign
          path: app/build/dsh-ios-unsign.ipa
          retention-days: 30
